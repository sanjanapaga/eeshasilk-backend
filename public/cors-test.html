<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button onclick="testCORS()">Test CORS</button>
    <div id="output"></div>
    <script>
        async function testCORS() {
            const output = document.getElementById('output');
            output.innerHTML = 'Testing...';
            try {
                const response = await fetch('https://eeshasilk-backend.onrender.com/api/categories');
                const data = await response.json();
                output.innerHTML = 'Success: ' + JSON.stringify(data);
                console.log(data);
            } catch (error) {
                output.innerHTML = 'Error: ' + error.message;
                console.error(error);
            }
        }
    </script>
</body>
</html>
